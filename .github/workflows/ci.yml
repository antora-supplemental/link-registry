name: CI

on:
  push:
  pull_request:

jobs:
  # Dogfood: the fast scan runs first; tests wait for it.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.adoc
            antora.yml
            /package.json
            /action.yml
            /bin/
            /lib/
      - uses: ./
  test:
    needs: links
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
